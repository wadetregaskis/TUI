name: CI

# ── The support matrix ────────────────────────────────────────────────────────
#
# Axes, and why each is where it is:
#
#   macOS   — for RELEASED Swift the toolchain comes from Xcode where a GA
#             image carries it, so the axis is the image: `macos-15` tops out
#             at Xcode 26.3 (Swift 6.2.x) and `macos-26` ships Xcode 26.6
#             (Swift 6.3.x), so pinning the Xcode MAJOR ("26") on both gives
#             6.2 and 6.3 coverage without hardcoding minors that GitHub
#             rebuilds weekly. 6.4 comes from Xcode 27 on macOS 27 (the
#             `xcode-27` image, see the note below) and from swift.org's 6.4
#             release on `macos-26`. UNRELEASED Swift (trunk) comes from
#             swift.org too.
#
#   Linux   — the cheapest axis to widen, because the official `swift:` images
#             pin the toolchain exactly. No setup action is involved or wanted.
#
#   Windows — the port is IN PROGRESS, and the lane is a ratchet rather than a
#             progress report. Each step declares for itself whether it may
#             fail, so the job as a whole promises exactly "everything that
#             builds on Windows today still builds". It is therefore REQUIRED
#             on released toolchains — a step that has gone green cannot
#             silently go back. Making a step binding is one deleted
#             `continue-on-error`; when the console layer lands, the last of
#             them goes and nothing staged is left. See the `windows_*` jobs.
#
# Swift version coverage. 6.2.4, 6.3.3 and 6.4.0 are the newest release of each
# 6.x line as of 2026-09-27 (6.4.0 shipped on 2026-09-14). All three are
# covered, and bind, on all three operating systems; trunk is covered, and
# advisory, on two:
#
#            macOS                      Linux                  Windows
#   6.2      Xcode 26 on macos-15       swift:6.2-noble        swift:6.2-…
#   6.3      Xcode 26 on macos-26       swift:6.3-noble        swift:6.3-…
#   6.4      Xcode 27 on xcode-27,      swift:6.4-noble        swift:6.4-…
#            swift.org 6.4 on macos-26
#   main     swift.org trunk snapshot   nightly-main-noble     (none: the Windows
#                                                               main image is
#                                                               rebuilt too rarely)
#
# Every released row floats to the newest patch of its line — an Xcode MAJOR,
# a `swift:6.x` image tag, swift.org's `6.4` with `check-latest` — so 6.4.1
# and 6.4.2 arrive without an edit here. That is deliberate (owner's call,
# 2026-09-28): a patch toolchain can break the build without a TUIkit change,
# and that red is accepted as the price of never testing a stale toolchain.
#
# The 6.4 row was `release/6.4.x` snapshots until 6.4.0 shipped. There is no
# `release/6.5` branch yet; when one is cut, its nightlies are the next early
# warning: add it on macOS (`swift: "6.5"`, `development: true`), on Linux
# beside main, and to the Windows matrix, whose nightlies are advisory by
# construction. Check the tag spelling on Docker Hub first: 6.2 and 6.3 had
# `nightly-6.3-…`-style tags, 6.4 had `nightly-6.4.x-…`, and that inconsistency
# is upstream's. When the version ships, promote it the way 6.4 was: the release
# images replace the nightlies, and they bind.
#
# macOS 27: the "macOS 27 · Xcode 27" lane binds since 2026-09-28, when macOS 27
# was out of beta (owner's call). GitHub's `xcode-27` image runs it (image
# 20260921: macOS 27.0, Darwin 27.0.0, Xcode 27.0 by default, 27.1 and a 27.2
# beta beside it) and is still the only image that does: there is no
# `macos-27` label yet, and actions/runner-images still lists `xcode-27` as
# "Xcode 27 (preview)". Its announcement (runner-images#14404) warns of
# queueing while capacity is balanced, and a required cell that queues holds
# the CI check pending until it runs. When a GA label appears (`macos-27`
# would match macos-15/macos-26), point the lane at it.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  # The nightly lanes only earn their keep if they run without a push.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Kept in step with the version developers run locally; bumping it is a
  # deliberate change, because a new SwiftLint release can add violations.
  SWIFTLINT_VERSION: "0.65.1"

jobs:
  # ── Lint ───────────────────────────────────────────────────────────────────
  # One platform is enough: SwiftLint's output is platform-independent. Runs
  # first and gates the rest, so a style slip fails in ~1 minute instead of
  # after eighteen builds.
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    container: swift:6.3-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Container jobs run as root over a workspace owned by the runner user,
      # which trips git's dubious-ownership guard and, through it, SwiftPM.
      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Install SwiftLint
        run: |
          apt-get update && apt-get install -y curl unzip
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          curl -fsSL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_${arch}.zip" -o swiftlint.zip
          unzip -o swiftlint.zip -d /usr/local/bin
          chmod +x /usr/local/bin/swiftlint
          rm swiftlint.zip

      - name: SwiftLint
        run: swiftlint --strict

      - name: Validate test module boundaries
        run: ./Tools/validate-test-boundaries.sh

      # Milliseconds, and it guards a failure nothing else can see: a manifest
      # with a path/branch/revision dependency builds and tests perfectly here
      # while being impossible for anyone to depend on, and one with an
      # unsafeFlags linker setting, or a compile one no trait can turn off,
      # imposes a flag on every client's build. The expensive half of that
      # question is the `consumer` job below.
      - name: Validate package manifest is consumable
        run: ./Tools/validate-package-manifest.sh

  # ── SwiftUI API parity ─────────────────────────────────────────────────────
  # One runner, one Xcode, deliberately. Both sides of the comparison come out
  # of `swift symbolgraph-extract` against the SDK, so the answer is a property
  # of the toolchain as much as of the code: run this on two SDKs and the two
  # reports disagree for reasons that have nothing to do with TUIkit. The
  # baseline records the toolchain it was taken on, and the tool says so when
  # they differ.
  #
  # This used to end "— but pinning the lane is what stops that ever mattering."
  # It does not, and saying so cost a red build nobody could act on. The pin is
  # the Xcode MAJOR, which floats across point releases on purpose (see the
  # matrix note at the top of this file), so `macos-26` + `xcode-version: "26"`
  # rode 6.2.4 → 6.3.3 and the 6.3 SwiftUI SDK arrived carrying three
  # `View.task` task-naming overloads TUIkit does not have. Three new gaps, no
  # code change.
  #
  # So: expect this lane to drift on any Xcode 26.x that moves the SwiftUI SDK,
  # and treat re-recording as routine maintenance rather than a regression —
  # which is exactly what the toolchain stamp is FOR. Read the stamp first when
  # this job goes red: if it disagrees with the runner's `swift --version`, the
  # gaps are the SDK's and the fix is `--accept` with the delta in the commit
  # message. Pinning a full version instead would trade this drift for a
  # different chore — a manual bump every time GitHub retires an image — and
  # would hide genuine SDK movement rather than reporting it.
  parity:
    name: "SwiftUI API parity"
    needs: lint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Toolchain version
        run: swift --version

      # The comparison's own rules, on hand-written symbol sets: no SDK, no
      # build, well under a second. Before the check, so a broken matcher
      # fails as itself rather than as a baseline that no longer matches.
      - name: Parity tool tests
        run: python3 -m unittest discover -s Tools/APIParity

      # The module map's own rules (lexer, span attribution, assigner,
      # checks) on hand-written sources and occurrences: no index, no
      # build, well under a second.
      - name: Module map tool tests
        run: python3 -m unittest discover -s Tools/ModuleMap

      # The clipboard probe's guards for the user's clipboard — what it puts
      # back, what it refuses to write over, when it takes the leak check — on
      # a file standing in for the clipboard; and the hairline probe's escapes,
      # reply and key reading, resync, restore, record naming and verdicts,
      # on socket pairs. No terminal, no SDK, under a second.
      - name: Terminal probe tests
        run: python3 -m unittest discover -s Tools/TerminalProbes -p 'test_*.py'

      # The deduplication check's own rules (what it concludes from a fold:
      # equal key paths, unlisted consumers, shared compared addresses, and
      # exit 2 whenever it cannot look) on Mach-O files the tests write: no
      # build, no toolchain, under a second. Tools/DedupCheck/README.md.
      - name: Dedup check tool tests
        run: python3 -m unittest discover -s Tools/DedupCheck -p 'test_*.py'

      # Fails on a new unexplained gap, on a gap CLOSED but not recorded, on a
      # new argument-label deviation, and on a map entry that has gone stale.
      # The last two are the ones no human notices: a map nobody audits stops
      # being a record of decisions and becomes a list of excuses.
      - name: API parity against SwiftUI
        run: python3 Tools/APIParity/api_parity.py --check

      # Not parity, but the same kind of check and a free ride on a job that
      # already has Python: the shipped palettes' row fills are generated from
      # Tools/RowFillValues/values.json, and a hand edit to either side alone
      # would ship a look nobody chose. Likewise the runtime rule's goldens,
      # which are its reference's (rule.py) answers: a change to the Swift rule
      # alone fails its tests, and to rule.py alone fails here.
      - name: Row fill table and rule goldens are generated from their sources
        run: python3 Tools/RowFillValues/generate.py --check

      # The same free ride, for a failure GitHub hides: a Markdown table row
      # with more cells than its header, which GitHub renders without the
      # extra cells, so two rows run together on one line show as one. Its
      # self-test first, so a broken check fails as itself, not as a pass.
      - name: Markdown table rows keep every cell on GitHub
        run: |
          python3 Tools/validate-markdown-tables.py --self-test
          python3 Tools/validate-markdown-tables.py

  # ── macOS ──────────────────────────────────────────────────────────────────
  macos:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `swift` is the swift.org toolchain to install; empty means use the
          # Xcode-provided one. `development` says whether it is a snapshot.
          # Without it, "6.4" is the newest 6.4.x release; with it, a version
          # is the newest snapshot on that release branch (for 6.4, swift.org's
          # `swift-6_4_x-branch`). `trunk` marks the lane that must be on main's
          # snapshots (checked after the install).
          - name: "macOS 15 · Xcode 26"
            runner: macos-15
            xcode: "26"
            swift: ""
            development: false
            smoke: quick
            experimental: false
            # The type-check budget at the end of the job, at this lane's
            # Swift's cap (see that step); it runs here and on the swift.org
            # 6.4 lane, each at its own compiler's cap.
            solver_scopes: 2000
            # The module map runs here only: see that step.
            module_map: true
          - name: "macOS 26 · Xcode 26"
            runner: macos-26
            xcode: "26"
            swift: ""
            development: false
            smoke: full
            experimental: false
          # Swift 6.4 on macOS 26, from swift.org: the 6.4 lane before Xcode
          # 27's bound, kept because no Xcode puts 6.4 on macOS 26. Until
          # 6.4.0 shipped this lane took the newest `release/6.4.x` snapshot
          # and was advisory.
          - name: "macOS 26 · Swift 6.4"
            runner: macos-26
            xcode: ""
            swift: "6.4"
            development: false
            smoke: quick
            experimental: false
            # 6.4.0 counts scopes far lower than 6.2 does for ordinary code,
            # so 6.2's 2,000 bounds it only loosely: see the step.
            solver_scopes: 1500
            # The release build at the end of the job: see that step.
            release_build: true
          # Trunk only. "latest" (with `development`) was the newest snapshot
          # on ANY branch, ranked by date, and on 2026-09-28 that was
          # `swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-09-26-a`, not trunk's
          # 2026-09-21 — so the lane tested whichever branch published last.
          # setup-swift 1.14.1 takes a snapshot name without its date as a
          # pattern over snapshot tags, and picks the newest match; only
          # trunk's tags start `swift-DEVELOPMENT-SNAPSHOT-`, a release
          # branch's being `swift-6.4.x-DEVELOPMENT-SNAPSHOT-…`. That is the
          # action's code rather than its documented contract, so the step
          # after the install checks the tag it got.
          - name: "macOS 26 · Swift main snapshot"
            runner: macos-26
            xcode: ""
            swift: "swift-DEVELOPMENT-SNAPSHOT"
            development: true
            trunk: true
            smoke: quick
            experimental: true
          # macOS 27 with Xcode 27's own toolchain (Swift 6.4). Binding; see
          # the macOS 27 note at the top of this file.
          - name: "macOS 27 · Xcode 27"
            runner: xcode-27
            xcode: "27"
            swift: ""
            development: false
            smoke: quick
            experimental: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode != ''
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}

      # `check-latest` is not optional here despite the action warning that it
      # "may break this action": it is the only input whose documented meaning
      # is "the newest toolchain swift.org has", which is the whole promise of
      # a lane that tracks a nightly — and what keeps the 6.4 lane on 6.4's
      # newest patch release, as `swift:6.4-noble` is on Linux. Without it the
      # action uses the swift.org data it pins for itself. That was a
      # months-old snapshot list when this lane was written; on 2026-09-27 a
      # lane without it synced the same swift.org commit as one with it — but
      # that is the action's behaviour of the day, not a contract, and a pinned
      # list would pin the "nightly" to an old toolchain and report green.
      # Breaking loudly is the correct failure mode here.
      #
      # 1.14.1 (2026-09-25) is the first release that knows swift.org's new tag
      # spelling: from 6.4 on a first release is `swift-6.4.0-RELEASE`, where it
      # used to be `swift-6.3-RELEASE`, and 1.14.0 could not install an exact
      # `6.4.0` request. (The range `6.4` matched under either.)
      #
      # `prefer-oss-toolchain` because the next step selects what this step
      # installed through the `TOOLCHAINS` it exports. For a RELEASE, the
      # action first looks for the Xcode swift.org lists beside it; if that
      # Xcode is on the image and bundles the same Swift, it selects the Xcode
      # and installs nothing, so `TOOLCHAINS` is never exported. No image this
      # lane runs on has Xcode 27 today, but GitHub adds Xcodes to images
      # without notice.
      - name: Install Swift ${{ matrix.swift }} from swift.org
        id: setup-swift
        if: matrix.swift != ''
        uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: ${{ matrix.swift }}
          development: ${{ matrix.development }}
          check-latest: true
          prefer-oss-toolchain: true
          # 1.14.1's cache moves an unversioned (trunk) snapshot out of the
          # directory it then installs from, on a cache miss — a spurious red
          # on the advisory snapshot lane. Snapshots are not cached; releases
          # still are.
          cache-snapshot: ${{ !matrix.development }}

      # Fails the trunk lane if the pattern above ever matches something else,
      # rather than letting it report a release branch's result as trunk's.
      - name: Check the snapshot is trunk's
        if: matrix.trunk
        env:
          TOOLCHAIN: ${{ steps.setup-swift.outputs.toolchain }}
        run: |
          tag="$(python3 -c 'import json, os; print(json.loads(os.environ["TOOLCHAIN"] or "{}").get("dir", ""))')"
          case "$tag" in
            swift-DEVELOPMENT-SNAPSHOT-*) echo "Trunk snapshot: $tag" ;;
            *) echo "::error::Expected a trunk snapshot (swift-DEVELOPMENT-SNAPSHOT-…), got '$tag'"; exit 1 ;;
          esac

      # A swift.org toolchain is not the default `swift`; it has to be
      # selected per invocation. Every later step goes through $SWIFT so the
      # build/test/smoke steps stay identical across every cell.
      #
      # TUIKIT_CONFIG_DIR keeps the apps off the runner's real preferences
      # (AppStorage honours it on every platform). It is set here rather than
      # in a job-level `env:` because the `runner` context only exists inside
      # steps — hence the $RUNNER_TEMP variable.
      - name: Resolve toolchain and isolate preferences
        run: |
          if [ -n "${{ matrix.swift }}" ]; then
            # Empty, the line below would read `xcrun --toolchain swift`, and
            # every later step would fail somewhere far from the cause.
            if [ -z "${TOOLCHAINS:-}" ]; then
              echo "::error::setup-swift installed no toolchain (TOOLCHAINS is unset)"
              exit 1
            fi
            echo "SWIFT=xcrun --toolchain ${TOOLCHAINS} swift" >> "$GITHUB_ENV"
          else
            echo "SWIFT=swift" >> "$GITHUB_ENV"
          fi
          echo "TUIKIT_CONFIG_DIR=$RUNNER_TEMP/tuikit-config" >> "$GITHUB_ENV"

      - name: Toolchain version
        run: $SWIFT --version

      - name: Build
        run: $SWIFT build --build-tests

      # The planned split into modules (Tools/ModuleMap): what WOULD cross a
      # module boundary upward, or fall into the split's silent traps (a
      # conformance in a module owning neither side, a constrained default
      # out of sight, public API above its type, POSIX API outside TUIkitApp,
      # code in the umbrella, a lower module its `lower` list does not name,
      # a file of a module's directory that no target compiles),
      # were TUIkit split as mapped today; and, of the modules carved so far,
      # a file that uses another module without importing it, which costs
      # every closure it passes there a run-time MainActor check (`imports`),
      # and a file that imports a module it names nothing of
      # (`stale-imports`).
      # It reads the index store the Build
      # step above wrote, so it costs no build: a few seconds on one lane,
      # because the map is the same on every Swift.
      # It gates: the plan's refactors and placement moves (steps A2, A4)
      # have landed, so the map has no new finding (what it still reports is
      # scheduled or accepted), and a new upward reference arriving during
      # the migration would be a compile error, or a cycle, once the modules
      # are real. A new finding fails the step with an error annotation
      # saying which reference or declaration, and why. So does a failure of
      # the tool itself (no index store, a libIndexStore that will not load),
      # and its annotation says that nothing was checked.
      # Tools/ModuleMap/README.md says how to read a finding and what to do.
      - name: Module map
        if: matrix.module_map
        run: python3 Tools/ModuleMap/modulemap.py check --github

      # Why the suite runs through Tools/ParallelTest/parallel_test.py, in
      # several processes, rather than `$SWIFT test` in one:
      #
      # `swift test` runs every test in ONE process, and ~81% of them are in
      # @MainActor suites, so they all queue on that process's one main actor
      # however many cores the runner has. Whole-suite runs had grown to
      # 290–650 s here (120–290 s in early 2026-09), and on 2026-09-28 the
      # trunk lane ran 640.6 s — long enough for a test's 600 s `Task.sleep`
      # to expire while the main actor was still starved, and fail
      # (LifecycleManagerTests; the test was fixed in a3bb5790). Each process
      # has its own main actor, so splitting the suite turns that queue back
      # into throughput. The harness launches swift-testing the way SwiftPM
      # does on each platform (the helper on macOS, the test binary itself on
      # Linux) and fails unless every enumerated test ran exactly once — see
      # Tools/ParallelTest/README.md.
      #
      # `-j 4` IS AN EXPERIMENT, to be tuned from these lanes' timings. GitHub's
      # arm64 macOS runners for public repositories (macos-15, macos-26; the
      # xcode-27 preview image is not listed, and presumably the same) have
      # 3 M1 cores and 7 GB, so four processes oversubscribe the CPU a little,
      # on purpose: they spend much of their time waiting on their own main
      # actor, not computing. MEMORY is the risk to watch. Measured locally, a
      # process peaks at ~265 MiB with the suite split twelve ways, and the
      # whole suite in one process at ~1 GiB, so four quarters should fit in
      # 7 GB beside the compiler's leftovers — but nobody has measured it on a
      # runner. If a macOS lane starts dying with no test failure named, or
      # slows sharply, lower `-j` first. There is no weight cache here, so the
      # groups are split by test count, not cost, and come out uneven (147 s
      # against 46 s at -j 4 locally); see Tools/ParallelTest/README.md,
      # "CI runs it", for the tunings that would even them.
      #
      # `--no-build`: the Build step above has built the tests, with the same
      # $SWIFT the harness reads. `--full-failing-logs`: a failing process's
      # whole log is printed (folded) into this job log, because the harness's
      # own files under .build do not outlive the runner.
      # The harness's own rules — partition proof, summary parsing, the
      # environment it mirrors per toolchain, the CI annotations — on
      # hand-written inputs: no build, ~1 s. Before the Test step, so a broken
      # harness fails as itself rather than as a red suite; once per run, like
      # the profiling driver's tests below, as nothing in it depends on the
      # lane's toolchain.
      - name: Parallel test harness tests
        if: matrix.smoke == 'full'
        run: python3 -m unittest discover -s Tools/ParallelTest -p 'test_*.py'

      - name: Test
        run: python3 Tools/ParallelTest/parallel_test.py -j 4 --no-build --full-failing-logs

      - name: Smoke — headless render of every scenario
        # With the buffer memo VERIFIED: `--selfcheck` renders each scenario
        # twice, so the memo serves on the second, and this re-renders every
        # served buffer and fails the scenario if the cells disagree. It is the
        # standing net for a memo serving a stale picture — which is wrong
        # pixels and no error otherwise, and which nothing else here would
        # notice. Costs one extra render per scenario.
        env:
          TUIKIT_VERIFY_RENDER_MEMO: "1"
        run: $SWIFT run Stress --selfcheck

      - name: Smoke — drive both apps in a real PTY (${{ matrix.smoke }})
        run: ./Tools/Smoke/ci-pty-smoke.sh ${{ matrix.smoke }}

      # The profiling driver hands the app it drives a configuration directory
      # of its own, never the user's preferences domain — which is where a
      # run without one writes on macOS, and where a profiling tour once left
      # its keystrokes as the owner's saved settings. A stub app in a PTY: no
      # build, ~9 s, so once per run rather than per lane.
      - name: Profiling driver tests
        if: matrix.smoke == 'full'
        run: python3 -m unittest discover -s Tools/Profiling -p 'test_*.py'

      # The package's products in RELEASE — every library target, Stress,
      # Example and the tools. Every other build in this workflow is debug, and
      # some failures exist only under `-O`: on 2026-10-08 Swift 6.3.3 could
      # not build TUIkitFoundation in release ("sending 'value' risks causing
      # data races", Theme.swift; a 6.3 optimiser clone that loses a function's
      # actor isolation, see the comment there) while every lane here was
      # green. On two lanes, one per compiler that matters most: this one
      # (swift.org's 6.4, the main target) and Linux's 6.3 on arm64 (see that
      # step). No tests in release: the suite runs once, in debug, above.
      # Release has a directory of its own under `.build`, so this shares the
      # checkouts with the Build step and disturbs nothing it built; before
      # the type-check budget, which must stay last.
      #
      # A limit of its own, because one way `-O` has gone wrong here is not an
      # error but a frontend that does not finish: on 2026-09-30 a recursion
      # handed closure literals took swift-frontend to tens of GB in release
      # on 6.2.4 and 6.3.3, and debug was unaffected. A macOS runner swaps
      # rather than kills, so without a limit the job would run to GitHub's
      # six-hour default. 30 minutes is the limit of every timed build step
      # in this workflow; every product in release took 2–4 minutes from
      # clean at -j 3 on the shared development machine (runners:
      # unmeasured).
      - name: Release build
        if: matrix.release_build
        timeout-minutes: 30
        run: $SWIFT build -c release

      # A TUIkit program has to launch copied out of `.build`, onto a Mac with
      # no toolchain. Below macOS 26 that rules out linking
      # libswiftCompatibilitySpan.dylib, a back-deployment library macOS lacks
      # until 26: a Span-family type in unspecialised generic code, or a
      # dependency such as swift-collections 1.4+, brings it in with no error
      # or warning, and on 2026-10-10 that stopped every copied-out 6.4 build
      # at launch on macOS 14 and 15. The script says why at length and how to
      # read a failure. Here because this lane builds release, what ships, with
      # 6.4, whose SwiftPM binds the library strongly where 6.2.4's bound
      # swift-collections' reference weakly. It reads every library module's
      # objects as well as Stress and Example, because no executable here
      # links TUIkitAppKit.
      - name: Release executables and library modules link no Span back-deployment library
        if: matrix.release_build
        run: Tools/check-span-compatibility.sh

      # A guard against type-check regressions that cannot flake: the library
      # and every module it builds on, rebuilt with every
      # expression's constraint system capped at `matrix.solver_scopes` solver
      # scopes. A count, not a time, so a slow runner cannot fail it — and why
      # each lane that runs it has a cap of its own: the count belongs to the
      # compiler. It runs on two lanes, each capped just above its compiler's
      # worst expression:
      #
      # * macOS 15 (Xcode 26.3's 6.2.4), 2,000. On 2026-10-07 the worst was
      #   TUIkitCore's Animation.swift:586, between 1,800 and 1,900 (not tried
      #   at 1,850), then ScrollTransition.swift:218, 1,700–1,800. (Until
      #   2026-10-10 the step also rebuilt swift-collections, whose
      #   UniqueDeque.swift:240 needed between 1,850 and 1,900.)
      # * macOS 26 with swift.org's 6.4, 1,500. 6.4.0 counts ordinary code far
      #   lower than 6.2 does (6.2's two worst are under 300 on 6.4), so 6.2's
      #   cap bounds 6.4 only loosely, and an expression 6.4's solver handles
      #   badly and 6.2's does not would pass it. On 2026-10-08 nothing failed
      #   on 6.4.0 at any cap from 1,000 up that passed on 6.2, and main
      #   (18325a175 and the Theme fix) built at 1,500. What binds this cap is
      #   not hand-written code, which first fails between 500 and 750, but
      #   the generated tables, one array literal each. Measured a file at a
      #   time (the command under "Reading a failure"), and alike on 6.2.4
      #   and 6.4.0, CombiningMarkRanges.generated.swift needs 1,450 — 4
      #   scopes for each of its 362 ranges, plus 2 — and
      #   ImageGlyphCalibration.generated.swift 1,157; RowFillTable.swift is
      #   between 750 and 1,000 (TC2, in the package). So the combining-mark
      #   table has room for 12 more ranges under 1,500, and a new Unicode
      #   release can add more than that. Spelling
      #   its literals `0x300 as UInt32` costs MORE (2,174 on 6.4.0); a cap
      #   the tables did not bind would need the generators to emit several
      #   literals joined at run time, which changes `-O` code, so the cap
      #   stays here. The lane takes the newest 6.4.x, and a patch release may
      #   move the counts.
      #
      # The caps were measured with the debug and the release defines alike;
      # this step builds debug on macOS, so code compiled only in release
      # (today one line, SoftTrap.report's `log.report`), only on another
      # platform, or only under an opt-in define such as
      # TUIKIT_VALUE_HASH_CENSUS is not counted here. Set on the command line
      # only: in Package.swift it would reach every client's build of TUIkit.
      # Swift Build (6.4's default) passes
      # `-Xswiftc -Xfrontend` through as the native build system does. Last in
      # the job, because it rebuilds those modules with a different command
      # line.
      #
      # Reading a failure: "the compiler is unable to type-check this expression
      # in reasonable time" at a file and line names an expression that now
      # needs more than the lane's cap. What to do depends on the expression:
      #
      # * Hand-written code: rewrite it rather than raising the cap. Give
      #   closure parameters and results their types, name intermediate
      #   results with explicit types (`let total: Int = xs.reduce(0, +)`),
      #   turn a `&&` chain of `==` into a guard list (the type-check commits
      #   of 2026-10-07 show each).
      # * A generated table (`*.generated.swift`): it grew when it was
      #   regenerated. That is not a regression, and a generated file is not
      #   rewritten by hand, so in the commit that regenerates it, set the cap
      #   of each lane it now exceeds just above what it needs, and update the
      #   numbers above. What a table needs is the smallest N for which
      #     swiftc -typecheck -Xfrontend -solver-scope-threshold=N FILE
      #   succeeds (bisect N): for the combining-mark table, 4 × its ranges +
      #   2. That works for the two tables that need only the standard
      #   library; RowFillTable.swift needs TUIkitStyling, so bisect this
      #   step's cap instead.
      # * Unchanged code, after the lane's Swift moved to a newer release: the
      #   compiler's counts moved. Find the worst site again (bisect the cap)
      #   and set the cap just above it.
      - name: Type-check budget (solver scopes)
        if: matrix.solver_scopes
        run: $SWIFT build --target TUIkit -Xswiftc -Xfrontend -Xswiftc -solver-scope-threshold=${{ matrix.solver_scopes }}

  # ── Linux ──────────────────────────────────────────────────────────────────
  linux:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Linux · Swift 6.2 · x86_64"
            runner: ubuntu-24.04
            image: "swift:6.2-noble"
            smoke: quick
            experimental: false
          - name: "Linux · Swift 6.3 · x86_64"
            runner: ubuntu-24.04
            image: "swift:6.3-noble"
            smoke: full
            experimental: false
          - name: "Linux · Swift 6.3 · arm64"
            runner: ubuntu-24.04-arm
            image: "swift:6.3-noble"
            smoke: quick
            experimental: false
            # The release build at the end of the job: see that step.
            release_build: true
          # Was `swiftlang/swift:nightly-6.4.x-noble`, advisory, until 6.4.0
          # shipped.
          - name: "Linux · Swift 6.4 · x86_64"
            runner: ubuntu-24.04
            image: "swift:6.4-noble"
            smoke: quick
            experimental: false
          - name: "Linux · Swift main nightly"
            runner: ubuntu-24.04
            image: "swiftlang/swift:nightly-main-noble"
            smoke: quick
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Container jobs run as root over a workspace owned by the runner user,
      # which trips git's dubious-ownership guard and, through it, SwiftPM.
      # TUIKIT_CONFIG_DIR keeps the apps off the runner's real preferences.
      - name: Trust the workspace and isolate preferences
        run: |
          git config --global --add safe.directory '*'
          echo "TUIKIT_CONFIG_DIR=$RUNNER_TEMP/tuikit-config" >> "$GITHUB_ENV"

      - name: Toolchain version
        run: swift --version

      # The `swift:*-noble` images carry no Python — swift-docker's Dockerfiles
      # install `libpython3-dev` (for LLDB) but not `python3`, and on the
      # 2026-09-29 run apt installed `python3` itself as NEW for the smoke
      # step's venv. The test harness and the PTY smoke both need it, so it is
      # installed once, here.
      - name: Install Python
        run: apt-get update && apt-get install -y python3 python3-venv

      # The swift-syntax range's floor, and its prebuilts (decisions B-D6M-2):
      # unpinned, SwiftPM resolves the newest swift-syntax in range and
      # compiles it, while it takes swift-syntax prebuilt only at 602.0.0 on a
      # 6.2 toolchain. Pinning it on this lane keeps the prebuilt here and
      # builds and tests TUIkitMacros against the oldest swift-syntax the
      # range allows; every other lane tests the newest.
      - name: Pin swift-syntax to the range's floor
        if: matrix.image == 'swift:6.2-noble'
        run: swift package resolve swift-syntax --version 602.0.0

      - name: Build
        run: swift build --build-tests

      # Several processes rather than `swift test`'s one; the macOS job's Test
      # step says why, and why `-j 4` is an experiment. Linux runners have
      # 4 cores and 16 GB (x86_64 and arm64 alike), so memory is less of a
      # worry here than on macOS. swift 6.4 and trunk build with swift-build
      # by default, which makes one test binary per test target instead of one
      # for the package; the harness runs each group's share of each binary in
      # turn, so there are still never more than four test processes at once.
      - name: Test
        run: python3 Tools/ParallelTest/parallel_test.py -j 4 --no-build --full-failing-logs

      - name: Smoke — headless render of every scenario
        env:
          TUIKIT_VERIFY_RENDER_MEMO: "1"
        run: swift run Stress --selfcheck

      - name: Smoke — drive both apps in a real PTY (${{ matrix.smoke }})
        run: ./Tools/Smoke/ci-pty-smoke.sh ${{ matrix.smoke }}

      # The macOS job's "Release build" step says why. 6.3's lane, because
      # 6.3 is the Swift whose `-O` pipeline broke on 2026-10-08 while its
      # debug build was clean; arm64, because x86_64 already runs the full PTY
      # smoke, so the two 6.3 lanes end closer together. That failure was in
      # the SIL pipeline, not the target: a reduction of it failed alike on
      # macOS arm64 and for x86_64 Linux (swift.org 6.3.3, its static SDK).
      # The whole package built in release for aarch64 Linux the same way
      # (swift.org 6.3.3, static SDK: musl, not this image's glibc) before
      # this lane first ran it. The same 30-minute limit as the macOS step,
      # for the same reason; here the container's out-of-memory kill may end
      # a runaway frontend sooner (unmeasured).
      - name: Release build
        if: matrix.release_build
        timeout-minutes: 30
        run: swift build -c release

  # ── Windows (advisory: the port is in progress) ─────────────────────────────
  #
  # Uses the official `swift:<version>-windowsservercore-ltsc2022` images, which
  # bundle the Visual Studio and Windows SDK prerequisites — the same approach
  # the Swift project's own reusable workflow takes, and the reason no
  # toolchain action appears here. Two Windows-specific constraints shape it:
  #
  #   * GitHub Actions `container:` is Linux-only, so the image has to be driven
  #     through an explicit `docker run`, and the Docker service is not started
  #     on Windows runners by default.
  #   * A `windowsservercore-ltsc2022` container needs a matching host kernel,
  #     which pins this lane to `windows-2022`. Server 2025 and the Windows 11
  #     client are covered by the native lane below.
  #
  # Steps are deliberately separate so the job reads as a porting scoreboard:
  # the four lower modules already compile without POSIX and must stay green,
  # while the umbrella, which re-exports TUIkitApp, is expected to fail until
  # the console layer is ported. The console layer is TUIkitApp since module
  # split step B3: POSIX by design, so it has no step of its own, and the
  # umbrella's step covers it. TUIkitFoundation, which held the console layer
  # until then, has a step of its own since B3 (see "Build TUIkitFoundation"),
  # and so have TUIkitChrome, TUIkitEffects, TUIkitMenus, TUIkitBitmaps,
  # TUIkitNavigation, TUIkitLists, TUIkitTextInput and TUIkitColorPicker, the
  # leaves steps B5b, B5c, B5, B6, B7 and B4 carved out of it, and
  # TUIkitPresentation, which step C1 peeled out of TUIkitNavigation, and
  # TUIkitTables, TUIkitTabs and TUIkitGrid, which steps C2 to C4 peeled out of
  # TUIkitLists, and TUIkitNumericControls, TUIkitPickers, TUIkitSearch and
  # TUIkitForms, which steps C7, C8, C5 and C6 peeled out of TUIkitTextInput.
  windows_container:
    name: "Windows Server 2022 · Swift ${{ matrix.swift }}"
    needs: lint
    runs-on: windows-2022
    # Binding on released toolchains: what builds on Windows today must keep
    # building. Nightlies stay advisory for the same reason they are everywhere
    # else — they break for reasons that have nothing to do with this package.
    continue-on-error: ${{ startsWith(matrix.swift, 'nightly') }}
    strategy:
      fail-fast: false
      matrix:
        # Released toolchains only, for now. The nightly that was here,
        # `nightly-6.4.x`, became `6.4` when 6.4.0 shipped; the release branch
        # it followed now only collects 6.4 patch releases, which the release
        # image tracks. Trunk is no substitute on Windows: its image,
        # `nightly-main-windowsservercore-ltsc2022`, had last been rebuilt on
        # 2026-07-09 when checked on 2026-09-27 (it was four weeks stale when
        # this lane was written), so it would test an old snapshot while
        # reporting as a nightly. Linux and macOS cover trunk. Add the next
        # release branch's nightly here once one exists — the
        # `continue-on-error` above makes any `nightly-…` entry advisory.
        swift: ["6.2", "6.3", "6.4"]
    steps:
      # The runner defaults to core.autocrlf=true. SwiftLint on Windows requires
      # LF, and CRLF churn in Swift sources helps nobody — check out verbatim.
      - name: Check out with LF endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Start Docker
        run: |
          Start-Service docker
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline) {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { Write-Host "Docker ready"; exit 0 }
            Start-Sleep -Seconds 5
          }
          Write-Error "Docker did not become ready"
          exit 1

      - name: Pull toolchain image
        id: image
        run: |
          $tag = "${{ matrix.swift }}"
          if ($tag.StartsWith("nightly")) {
            $image = "swiftlang/swift:$tag-windowsservercore-ltsc2022"
          } else {
            $image = "swift:$tag-windowsservercore-ltsc2022"
          }
          docker pull $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "image=$image" >> $env:GITHUB_OUTPUT

      - name: Toolchain version
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "--version"

      # ── Binding: what already builds on Windows ──
      # This list is what CI has been observed to do, not what we would like it
      # to do — the point of binding it is that it can only ever grow. When a
      # step below goes green, delete its `continue-on-error` and it joins this
      # group permanently.
      - name: "Build TUIkitCore"
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitCore"

      - name: "Build TUIkitStyling"
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitStyling"

      # Passes on 6.3 and later; fails on 6.2 for reasons not yet diagnosed
      # (the lane was advisory, so nobody had to look). Binding everywhere the
      # evidence supports, advisory exactly where it does not.
      - name: "Build TUIkitView"
        continue-on-error: ${{ matrix.swift == '6.2' }}
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitView"

      # ── Expected to fail until the port lands ──
      # `continue-on-error` per step, so one red stage does not hide the ones
      # after it: the whole point is to watch them go green over time.

      # `ShapeSampling` imported Glibc-or-Darwin and called `cos`/`sin`
      # unconditionally, so Windows got no `cos` at all. Fixed, and green on
      # all five Windows lanes since, so it is binding.
      - name: "Build TUIkitImage"
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitImage"

      # ── The modules carved out of TUIkitFoundation ──
      # Module split step B2's two side modules, which need TUIkitCore alone.
      # Their POSIX code sits in POSIX-only `#if` arms (CLAUDE.md), and
      # TerminalHost.swift names `pid_t` only inside its Darwin arms (decisions
      # B-SPB2-1), but no Windows toolchain has built them yet: advisory until
      # CI has seen them green, then binding like the four above.
      - name: "Build TUIkitStrings"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitStrings"

      - name: "Build TUIkitTerminalHost"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitTerminalHost"

      # ── The module the console layer left ──
      # TUIkitFoundation held the console layer until module split step B3
      # carved it out as TUIkitApp, so until then the umbrella's step stood for
      # it. Since B3 its directories import no Darwin, Glibc or Musl and call
      # no termios, ioctl or signal API (checked by grep, 2026-10-08); whether
      # anything else stops it on Windows is unmeasured, since no Windows build
      # of it without the console layer has been seen. Advisory until CI has
      # seen it green, then binding like the four above. It builds the two
      # side modules above first, so a red step here after green ones there is
      # TUIkitFoundation's own.
      - name: "Build TUIkitFoundation"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitFoundation"

      # ── The leaves carved out above TUIkitFoundation ──
      # Module split step B5b's three leaves, each built on TUIkitFoundation
      # alone: TUIkitChrome (the status bar view, toolbars, notifications,
      # tooltips, the window chrome host), TUIkitEffects (transitions, visual,
      # scroll and colour effects) and TUIkitMenus (Menu, ControlGroup,
      # .contextMenu). They come first: TUIkitPresentation depends on
      # TUIkitChrome. Step B5c's leaf, TUIkitBitmaps (Image's bitmap path,
      # AsyncImage, the image options), built on TUIkitFoundation and
      # TUIkitImage (which TUIkitFoundation no longer needs since B5c), comes
      # after them. Step B5's leaf, TUIkitNavigation, built on
      # TUIkitFoundation: the navigation containers. Step C1's,
      # TUIkitPresentation, which it peeled out of TUIkitNavigation, built on
      # TUIkitFoundation and TUIkitChrome: the presentations. Step B6's leaf,
      # TUIkitLists, built on TUIkitFoundation: the lists. Step C2's,
      # TUIkitTables, and step C3's, TUIkitTabs, which they peeled out of
      # TUIkitLists, each built on TUIkitFoundation and TUIkitLists, so they
      # come after it: the tables and the tab views. Step C4's, TUIkitGrid,
      # which it peeled out of TUIkitLists too, built on TUIkitFoundation
      # alone: the grids. Step B7's leaf, TUIkitTextInput, built on
      # TUIkitFoundation: the text inputs. Step C7's, TUIkitNumericControls,
      # which it peeled out of TUIkitTextInput (the last peel), built on
      # TUIkitFoundation alone: the numeric controls. Step C8's,
      # TUIkitPickers, which it peeled out of TUIkitTextInput too, built on
      # TUIkitFoundation alone: the pickers. Step C5's, TUIkitSearch, which it
      # peeled out of TUIkitTextInput too, built on TUIkitFoundation,
      # TUIkitTextInput and TUIkitPickers, so it comes after both: search.
      # Step C6's, TUIkitForms, which it peeled out of TUIkitTextInput too,
      # built on TUIkitFoundation alone: the forms and the view groupings.
      # Step B4's leaf, TUIkitColorPicker, built on TUIkitFoundation,
      # TUIkitImage, TUIkitPresentation, TUIkitTabs, TUIkitTextInput,
      # TUIkitPickers and TUIkitNumericControls, so it comes last. None imports
      # Darwin, Glibc or Musl or calls a termios, ioctl, signal or
      # DispatchSource API (checked by grep, 2026-10-08 and, for B5b's three,
      # TUIkitBitmaps, TUIkitTextInput, TUIkitNavigation, TUIkitPresentation
      # and TUIkitTables, 2026-10-09, and TUIkitTabs, TUIkitGrid, TUIkitSearch,
      # TUIkitForms, TUIkitPickers and TUIkitNumericControls, 2026-10-10). Two
      # have an `#if`, none around a POSIX call:
      # TUIkitEffects one, `canImport(Symbols)` around the `.symbolEffect`
      # modifiers that take Apple's Symbols types (absent off macOS, as on
      # Linux), and TUIkitTables three (TUIkitLists' until step C2), on two
      # conditions, `canImport(Darwin)` once (a string column's default
      # comparator) and `canImport(UniformTypeIdentifiers)` twice (a table
      # row's item provider). So they are meant to build on Windows, but none
      # can until TUIkitFoundation does: advisory until CI has seen them
      # green, then binding like the four above. TUIkitApp, the other leaf, is
      # POSIX by design and has no step (the umbrella's covers it).
      - name: "Build TUIkitChrome"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitChrome"

      - name: "Build TUIkitEffects"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitEffects"

      - name: "Build TUIkitMenus"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitMenus"

      - name: "Build TUIkitBitmaps"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitBitmaps"

      - name: "Build TUIkitNavigation"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitNavigation"

      - name: "Build TUIkitPresentation"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitPresentation"

      - name: "Build TUIkitLists"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitLists"

      - name: "Build TUIkitTables"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitTables"

      - name: "Build TUIkitTabs"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitTabs"

      - name: "Build TUIkitGrid"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitGrid"

      - name: "Build TUIkitTextInput"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitTextInput"

      - name: "Build TUIkitNumericControls"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitNumericControls"

      - name: "Build TUIkitPickers"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitPickers"

      - name: "Build TUIkitSearch"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitSearch"

      - name: "Build TUIkitForms"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitForms"

      - name: "Build TUIkitColorPicker"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitColorPicker"

      # ── The four modules' own test targets ──
      # Each links only its module, so these are the first tests Windows can
      # run without a console layer. Advisory until they go green, then binding
      # like everything above.
      - name: "Build TUIkitCoreTests"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitCoreTests"

      - name: "Build TUIkitStylingTests"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitStylingTests"

      - name: "Build TUIkitViewTests"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitViewTests"

      - name: "Build TUIkitImageTests"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkitImageTests"

      # Every advisory step carries a timeout. `swift build --build-tests` on
      # the 6.3 container printed its last diagnostic and then sat for six
      # hours until the job's own limit cancelled it (2026-09-04) — and a
      # cancelled job is not `continue-on-error`'s to forgive, so the gate
      # went red for a hang in a step that is allowed to fail. Thirty minutes
      # is several times what any of these takes when it finishes.
      - name: "Build TUIkit (umbrella)"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --target TUIkit"

      - name: "Build everything"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "build --build-tests"

      - name: "Test"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "test"

      - name: "Smoke — headless render of every scenario"
        continue-on-error: true
        timeout-minutes: 30
        run: ./Tools/ci-windows-swift.ps1 -Image "${{ steps.image.outputs.image }}" -Arguments "run Stress --selfcheck"

  # Server 2025 and the Windows 11 client cannot host an ltsc2022 container, so
  # these install the toolchain natively. This is the second place a toolchain
  # action is genuinely needed — it also installs the Visual Studio components
  # and runs VsDevCmd, which is the fiddly part.
  windows_native:
    name: "${{ matrix.name }} · Swift 6.3"
    needs: lint
    runs-on: ${{ matrix.runner }}
    # Binding: Swift 6.3 is a release, and the steps below say individually
    # which ones are allowed to fail.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Windows Server 2025"
            runner: windows-2025
          - name: "Windows 11 · arm64"
            runner: windows-11-arm
    steps:
      - name: Check out with LF endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      # 6.3 and not 6.4, deliberately for now. These lanes are here for the OS
      # (Server 2025, and Windows 11 on arm64), and 6.4 already binds on
      # Windows in the container lane. What a move to 6.4 would add is a
      # dependency on setup-swift's 6.4.0 support, which arrived in 1.14.1
      # (2026-09-25) and had no record on any runner when this was written;
      # raise this line once the macOS 6.4 lane, which uses the same action,
      # has one.
      - name: Install Swift
        uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: "6.3"

      - name: Toolchain version
        run: swift --version

      - name: "Build TUIkitCore"
        run: swift build --target TUIkitCore
      - name: "Build TUIkitStyling"
        run: swift build --target TUIkitStyling
      - name: "Build TUIkitView"
        run: swift build --target TUIkitView

      # Green on both native lanes as well as every container lane, so binding
      # here too.
      - name: "Build TUIkitImage"
        run: swift build --target TUIkitImage

      # Advisory, as in the container lane — see that lane.
      - name: "Build TUIkitStrings"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitStrings
      - name: "Build TUIkitTerminalHost"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitTerminalHost
      - name: "Build TUIkitFoundation"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitFoundation
      - name: "Build TUIkitChrome"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitChrome
      - name: "Build TUIkitEffects"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitEffects
      - name: "Build TUIkitMenus"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitMenus
      - name: "Build TUIkitBitmaps"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitBitmaps
      - name: "Build TUIkitNavigation"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitNavigation
      - name: "Build TUIkitPresentation"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitPresentation
      - name: "Build TUIkitLists"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitLists
      - name: "Build TUIkitTables"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitTables
      - name: "Build TUIkitTabs"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitTabs
      - name: "Build TUIkitGrid"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitGrid
      - name: "Build TUIkitTextInput"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitTextInput
      - name: "Build TUIkitNumericControls"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitNumericControls
      - name: "Build TUIkitPickers"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitPickers
      - name: "Build TUIkitSearch"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitSearch
      - name: "Build TUIkitForms"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitForms
      - name: "Build TUIkitColorPicker"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitColorPicker

      # The same scoreboard rows as the container lane, with the same timeouts
      # and for the same reason — see that lane.
      - name: "Build TUIkitCoreTests"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitCoreTests

      - name: "Build TUIkitStylingTests"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitStylingTests

      - name: "Build TUIkitViewTests"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitViewTests

      - name: "Build TUIkitImageTests"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --target TUIkitImageTests

      - name: "Build everything"
        continue-on-error: true
        timeout-minutes: 30
        run: swift build --build-tests

      - name: "Test"
        continue-on-error: true
        timeout-minutes: 30
        run: swift test

      - name: "Smoke — headless render of every scenario"
        continue-on-error: true
        timeout-minutes: 30
        env:
          TUIKIT_VERIFY_RENDER_MEMO: "1"
        run: swift run Stress --selfcheck

  # ── WebAssembly ────────────────────────────────────────────────────────────
  # A compile lane for `wasm32-unknown-wasip1`, and a ratchet like the Windows
  # one: everything listed here builds today, so a step going red means someone
  # reached for POSIX in a module that had stopped needing it.
  #
  # The container is pinned to an exact patch on purpose. A Swift SDK loads only
  # under the toolchain version it was built for, so `swift:6.3-noble` — which
  # moves — would eventually pair a 6.3.x toolchain with a 6.3.3 SDK and fail
  # for a reason that has nothing to do with this package. Pinning makes the SDK
  # URL below deterministic; raising both together is the intended maintenance.
  #
  # 6.3 rather than 6.2: on 6.2.4 the compiler asserts on `TupleView`'s
  # pack-expansion conformance and `TUIkitView` cannot be built for wasm at all
  # (the same assertion that blocks the Linux static-SDK check).
  #
  # And 6.3.3 rather than 6.4.0, for now: 6.4.0 shipped with a matching SDK,
  # but 6.3.3 is the only version the port has been measured with (see
  # Documentation/WebAssembly.md), and a binding lane moves to a pair somebody
  # has built. Moving is every 6.3.3 below plus swift.org's published
  # checksum for the 6.4.0 bundle.
  wasm:
    name: "WebAssembly · wasm32-unknown-wasip1"
    needs: lint
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust the workspace
        run: git config --global --add safe.directory '*'

      - name: Install the WebAssembly SDK
        run: |
          set -eux
          apt-get update && apt-get install -y curl
          url="https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz"
          curl -fsSL "$url" -o wasm-sdk.tar.gz
          echo "cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7  wasm-sdk.tar.gz" | sha256sum -c -
          swift sdk install wasm-sdk.tar.gz
          swift sdk list

      # `--static-swift-stdlib` is what points the compiler at the SDK's
      # `swift_static` resources; without it Foundation is missing from an SDK
      # that contains it. The SDK is named by bundle id rather than by triple
      # because the bundle also installs an embedded-Swift SDK under the same
      # triple, and SwiftPM picks between them arbitrarily.
      #
      # One `--target` per step, as the Windows lanes do it. `swift build` keeps
      # only the LAST `--target` it is given, so the single step this used to be
      # (`--target TUIkitCore --target TUIkitStyling --target TUIkitView
      # --target TUIkitImage`) built TUIkitImage and what it depends on
      # (TUIkitStyling, CSTBImage) and nothing else: "Build of target:
      # 'TUIkitImage' complete!". TUIkitCore and TUIkitView were compiled only
      # by the Example step below, which is the step that reported a 64-bit
      # literal in TUIkitView — so the ratchet this lane promises for the four
      # modules held for two of them.
      - name: "Build TUIkitCore for WebAssembly"
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm --static-swift-stdlib --target TUIkitCore
      - name: "Build TUIkitStyling for WebAssembly"
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm --static-swift-stdlib --target TUIkitStyling
      - name: "Build TUIkitView for WebAssembly"
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm --static-swift-stdlib --target TUIkitView
      - name: "Build TUIkitImage for WebAssembly"
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm --static-swift-stdlib --target TUIkitImage

      - name: Build the umbrella and the Example app
        run: |
          swift build --swift-sdk swift-6.3.3-RELEASE_wasm --static-swift-stdlib \
            --product Example -Xlinker -z -Xlinker stack-size=16777216

  # ── DocC Documentation ─────────────────────────────────────────────────────
  # Building the docs is NOT optional-extra: it is the only check that the
  # reference still covers the whole package. The build asserts that pages
  # exist for types declared in the sibling modules, so the day someone
  # documents a single target again — which silently drops `View`, `Color`,
  # `Binding` and friends from the site — this job fails instead of the docs
  # quietly losing half their content. See Tools/BuildDocs/README.md.
  docs:
    name: Build DocC
    needs: lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26 (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      # `--strict` and not just a build: DocC's warnings never fail it, and they
      # are almost all broken doc LINKS — which render as plain text, so nothing
      # on the page says a reference was lost. Uncounted, they accumulate: 659 by
      # 2026-08-04, and 435 again by 2026-09-08 (82 source lines) because this
      # job built the archive and never read what DocC said about it.
      - name: Build DocC documentation
        run: ./Tools/BuildDocs/build-docs.sh --output docc-output --static-hosting --strict

  # ── Versioned consumer ─────────────────────────────────────────────────────
  # Tags only. Everything else in this file builds the package as ITSELF; this
  # builds it as somebody else's dependency, resolved by exact version, and
  # RUNS the result so that the two resources read from TUIkit's bundle —
  # VERSION and the localization tables — have to actually resolve. Both fail
  # silently in a real app (wrong version in a status bar, every framework
  # string in English whatever the user asked for), which is what makes them worth a
  # gate rather than a test.
  #
  # A tag is the right moment: it is the last point before something is
  # published, and a couple of minutes there costs nothing. The cheap half —
  # the manifest constructs that make resolution outright impossible — runs on
  # every push, in `lint`.
  consumer:
    name: Versioned consumer
    needs: lint
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode 26 (Swift 6.2+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Resolve, build and run a versioned consumer
        run: ./Tools/verify-versioned-consumer.sh

  # ── Gate ───────────────────────────────────────────────────────────────────
  # The single job to mark "required" in branch protection. Matrix job names
  # move whenever the matrix changes, so requiring them directly would mean
  # editing branch protection on every matrix edit; and a job that is *skipped*
  # reports as success to branch protection, which this makes impossible to
  # miss. Windows IS asserted on: see the note beside the required list.
  gate:
    name: CI
    if: always()
    needs: [lint, parity, macos, linux, wasm, windows_container, windows_native, docs, consumer]
    runs-on: ubuntu-24.04
    steps:
      - name: Check required lanes
        run: |
          # "skipped" counts as a failure here on purpose: a required lane that
          # never ran has proved nothing, but branch protection would read the
          # skip as success if it were watching that job directly.
          required="lint:${{ needs.lint.result }}
          parity:${{ needs.parity.result }}
          macos:${{ needs.macos.result }}
          linux:${{ needs.linux.result }}
          wasm:${{ needs.wasm.result }}
          docs:${{ needs.docs.result }}
          windows_container:${{ needs.windows_container.result }}
          windows_native:${{ needs.windows_native.result }}"

          # The consumer lane runs on tags only, so it is required exactly when
          # it runs. Adding it to the list unconditionally would make every
          # ordinary push fail on its skip — and leaving it out entirely would
          # mean the one build that gates a RELEASE could go red unnoticed.
          if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            required="$required
            consumer:${{ needs.consumer.result }}"
          fi

          # The Windows lanes are required now. Not because the port is done —
          # it is not — but because each of their steps says for itself whether
          # it is allowed to fail, so the job as a whole is exactly the promise
          # "everything that builds on Windows today still does". That set only
          # grows: a step going green loses its `continue-on-error` and can
          # never silently go back.
          echo "Required lanes:"

          failed=""
          for entry in $required; do
            lane="${entry%%:*}"
            result="${entry#*:}"
            echo "  $lane: $result"
            [ "$result" = "success" ] || failed="$failed $lane"
          done

          if [ -n "$failed" ]; then
            echo "::error::Required lane(s) did not succeed:$failed"
            exit 1
          fi
          echo
          echo "All required lanes green."
