# SwiftUI parity against Xcode 27's SDK, run by hand.
#
# Why this exists: the parity tool (Tools/APIParity/api_parity.py, see its
# README) reads SwiftUI's public API out of the SDK of the Xcode it runs
# under, and every Mac TUI is developed on is too old to run Xcode 27. So the
# comparison has only ever been made against Xcode 26's SwiftUI, and the 2026
# additions are known only from blog posts — not good enough for the parity
# rule, which wants exact signatures. GitHub's `xcode-27` image has Xcode 27
# (see the macOS 27 note at the top of ci.yml): this job runs the tool there
# once, when someone presses "Run workflow", and keeps what it found as the
# run's artifact.
#
# Manual only (`workflow_dispatch`): it is a survey for a person to read when
# an SDK moves, not a check. Nothing fails because of a gap, and it reads the
# repository only. The owner's ruling SDK-27 (a), 2026-11-09.
#
# The artifact holds:
#   parity.txt      the tool's report, as it prints it
#   parity.json     the full result (`--json`): every gap, label deviation
#                   and stale map entry, with the toolchain that found them
#   deprecated.txt  SwiftUI's deprecations TUI still implements (`--deprecated`)
#   swiftui/        SwiftUI's and SwiftUICore's symbol graphs from the SDK,
#                   which carry each new declaration's exact signature

name: SwiftUI parity (Xcode 27)

on:
  workflow_dispatch:
    inputs:
      xcode:
        description: "Xcode to select (setup-xcode spelling: 27, 27.1, latest-stable …)"
        required: false
        default: "27"
      target:
        description: "Target triple both sides' symbol graphs are extracted for"
        required: false
        default: "arm64-apple-macosx27.0"

permissions:
  contents: read

concurrency:
  group: swiftui-parity-27
  cancel-in-progress: false

jobs:
  parity:
    name: SwiftUI parity · Xcode ${{ inputs.xcode }}
    # The only image with Xcode 27 today; point at `macos-27` when GitHub
    # adds that label (ci.yml's macOS 27 note says the same of its lane).
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/parity-report
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select Xcode ${{ inputs.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode }}

      - name: Toolchain and SDK
        run: |
          mkdir -p "$OUT"
          {
            xcodebuild -version
            swift --version
            echo "SDK: $(xcrun --show-sdk-path) ($(xcrun --show-sdk-version))"
          } | tee "$OUT/toolchain.txt"

      # `--work-dir` keeps the symbol graphs, so SwiftUI's can be uploaded:
      # the report names a gap by its key, the graph has its declaration.
      - name: Compare TUI with SwiftUI
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -o pipefail
          python3 Tools/APIParity/api_parity.py \
            --json "$OUT/parity.json" --work-dir "$RUNNER_TEMP/parity-graphs" --target "$TARGET" \
            2>&1 | tee "$OUT/parity.txt"
          cp -R "$RUNNER_TEMP/parity-graphs/swiftui" "$OUT/swiftui"

      - name: SwiftUI deprecations TUI still has
        if: always()
        continue-on-error: true
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -o pipefail
          python3 Tools/APIParity/api_parity.py --deprecated --target "$TARGET" 2>&1 | tee "$OUT/deprecated.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swiftui-parity-xcode-${{ inputs.xcode }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
